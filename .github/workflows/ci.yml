name: Distribution readiness

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Privacy gate (current sources)
        run: python tools/privacy-check.py
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Complete no-call regression suite
        env:
          FACETIME_RECIPIENT: test-recipient@example.invalid
          FACETIME_USAGE_DIR: ${{ runner.temp }}/facetime-usage-test
        run: python -m unittest discover -s tests -v
      - name: MCP stdio negotiation, no outgoing call
        run: python tests/mcp_protocol_smoke.py
      - name: Installer dry run
        run: python tools/install.py install --dry-run --non-interactive
      - name: macOS clean install smoke (isolated temp prefix)
        if: runner.os == 'macOS'
        run: |
          set +e
          FACETIME_CONFIG_DIR="$RUNNER_TEMP/facetime-config" FACETIME_BIN_DIR="$RUNNER_TEMP/facetime-bin" \
            ./install.sh --non-interactive --recipient tester@example.invalid --accept-unlocked-only --no-watchdog \
            --prefix "$RUNNER_TEMP/facetime-package" --skip-deps
          result=$?
          set -e
          # --skip-deps is deliberately not a ready installation: doctor returns 2.
          test "$result" -eq 2
          test -x "$RUNNER_TEMP/facetime-package/current/.bin/facetime-vision-ocr"
          test -x "$RUNNER_TEMP/facetime-bin/facetime-controller"
          FACETIME_USAGE_DIR="$RUNNER_TEMP/usage-e2e" "$RUNNER_TEMP/facetime-bin/facetime-controller" stats --json > "$RUNNER_TEMP/stats.json"
          python -c 'import json,sys; x=json.load(open(sys.argv[1])); assert set(x["minimax_by_model"]) == {"speech-2.8-hd","speech-2.8-turbo"}' "$RUNNER_TEMP/stats.json"
          "$RUNNER_TEMP/facetime-bin/facetime-controller" --help >/dev/null
          test -f "$RUNNER_TEMP/facetime-config/config.json"
          test "$(stat -f %Lp "$RUNNER_TEMP/facetime-config/config.json")" -eq 600
          python -m json.tool "$RUNNER_TEMP/facetime-config/config.json" >/dev/null
          python -m json.tool "$RUNNER_TEMP/facetime-config/tts.json" >/dev/null
          FACETIME_CONFIG_DIR="$RUNNER_TEMP/facetime-config" FACETIME_BIN_DIR="$RUNNER_TEMP/facetime-bin" \
            ./uninstall.sh --prefix "$RUNNER_TEMP/facetime-package"
          test -f "$RUNNER_TEMP/facetime-config/config.json"
          test ! -e "$RUNNER_TEMP/facetime-package/current"
